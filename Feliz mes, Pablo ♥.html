<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz mes, Pablo ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6d2;--paper:#fffdf6;--ink:#222;--lime:#cfe88a;--pink:#f6b6d2;--sky:#bfe3f7;--butter:#ffe98a;--lav:#d9c8f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1c26}}
:root[data-theme="dark"]{--bg:#1f1c26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Gaegu','Patrick Hand',cursive;font-size:22px;color:var(--ink);padding:14px}
.sheet{position:relative;max-width:900px;margin:0 auto;background:var(--paper);border-radius:18px;padding:34px 22px 40px;overflow:hidden;box-shadow:0 6px 30px #0003}
.hand{font-family:'Caveat','Gaegu',cursive}
.wob{filter:url(#wob)}
svg{overflow:visible}
.abs{position:absolute;pointer-events:none}
/* animaciones */
[data-pop]{opacity:0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}100%{opacity:1;transform:scale(1)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35;transform:scale(.75) rotate(15deg)}}
.fl{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.tap{cursor:pointer}
.wiggle{animation:wig .6s}
@keyframes wig{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.burst{position:fixed;z-index:50;pointer-events:none;font-size:26px;color:#ef6fa3;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-140px) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.tw,.fl{animation:none}}
/* título */
.title{position:relative;width:min(560px,92%);margin:6px auto 0;text-align:center}
.title svg{position:absolute;inset:0;width:100%;height:100%}
.title h1{position:relative;margin:0;font-size:clamp(26px,6vw,40px);padding:10px 8px;font-weight:700}
.wavy{display:block;width:min(520px,80%);margin:6px auto 18px}
/* pastillas */
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.pill{border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-weight:700;transform:rotate(-3deg)}
.pill.p{background:var(--pink)}.pill.l{background:var(--lav);transform:rotate(2deg)}.pill.b{background:var(--butter)}
/* razones + retrato */
.top{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:680px){.top{grid-template-columns:1fr}}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.reason{display:flex;gap:12px;align-items:flex-start;line-height:1.15;cursor:pointer}
.reason:nth-child(odd){transform:rotate(-1.6deg)}.reason:nth-child(even){transform:rotate(1.8deg)}
.num{flex:none;min-width:52px;height:52px;display:grid;place-items:center;font-weight:700;font-size:24px;border-radius:55% 45% 50% 50%/50% 55% 45% 50%}
.portrait-wrap{position:relative;text-align:center;padding:20px 0}
.portrait{position:relative;width:min(260px,80%);aspect-ratio:3/4;margin:0 auto;border:6px solid var(--ink);border-radius:50%;background:var(--sky);overflow:hidden;cursor:pointer;display:block}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;display:block}
.portrait input{display:none}
.tag{position:absolute;font-weight:700;font-size:20px}
.hint{font-size:16px;opacity:.6;margin-top:6px}
.him{display:inline-block;background:var(--butter);padding:0 14px;border-radius:40% 60% 50% 50%;font-weight:700;transform:rotate(-4deg);margin-top:8px}
/* banda rosa */
.band{position:relative;margin:28px auto 22px;text-align:center;width:min(760px,100%)}
.band svg{position:absolute;inset:0;width:100%;height:100%}
.band p{position:relative;margin:0;padding:12px 10px;font-size:clamp(20px,4.4vw,30px);letter-spacing:1.5px;font-weight:700}
/* corazón */
.heartbox{position:relative;width:min(520px,100%);margin:10px auto}
.heartbox>svg.big{width:100%;display:block}
.heartbox .txt{position:absolute;left:19%;right:19%;top:24%;text-align:center;font-size:clamp(20px,4.6vw,32px);line-height:1.05;transform:rotate(-3deg)}
.heartbox .txt b{background:linear-gradient(transparent 55%,var(--lime) 55%);}
.heartbox .kitty{position:absolute;right:8%;bottom:6%;width:22%}
.comfort{max-width:420px;margin:8px auto 0;text-align:center;font-size:26px;line-height:1.1;transform:rotate(1.5deg)}
/* fila de stickers */
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px 22px;margin-top:26px}
.row svg{height:130px;width:auto}
/* contador */
.count{text-align:center;margin-top:26px}
.count .n{display:inline-block;margin:4px 6px;padding:4px 14px;border:3px solid var(--ink);border-radius:18px 24px 16px 22px;background:var(--butter);min-width:84px}
.count .n b{display:block;font-size:34px;line-height:1}
.count .n span{font-size:16px}
.btn{margin:26px auto 0;display:block;border:4px solid var(--ink);background:var(--pink);font:700 28px 'Gaegu',cursive;color:var(--ink);padding:8px 30px;border-radius:55% 45% 50% 50%/60% 50% 50% 40%;cursor:pointer;transform:rotate(-2deg);box-shadow:4px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px) rotate(-2deg);box-shadow:1px 2px 0 var(--ink)}
.sign{text-align:right;margin:18px 6px 0;font-size:30px}
/* carta */
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:40}
.modal.on{display:flex}
.letter{position:relative;background:#fff9e8;max-width:560px;max-height:86vh;overflow:auto;padding:28px 26px;border:4px solid var(--ink);border-radius:20px 26px 18px 24px;font-size:24px;line-height:1.2;animation:pop .5s forwards;color:var(--ink)}
.letter h2{margin:0 0 10px;font-size:36px}
.letter p{margin:0 0 12px}
.x{position:absolute;top:8px;right:12px;border:0;background:none;font:700 30px 'Gaegu',cursive;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>

<!-- Filtro para trazos temblorosos (efecto hecho a mano) y símbolos reutilizables -->
<svg width="0" height="0" style="position:absolute">
<filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
<filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
<defs>
<symbol id="star4" viewBox="0 0 100 100"><path d="M50 3C54 35 65 46 97 50C65 54 54 65 50 97C46 65 35 54 3 50C35 46 46 35 50 3Z" fill="var(--c,#f4a6c8)" stroke="var(--s,#f4a6c8)" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="star" viewBox="0 0 100 100"><path d="M50 6L62 38L95 40L69 60L78 93L50 74L22 93L31 60L5 40L38 38Z" fill="var(--c,#ffd84d)" stroke="var(--c,#ffd84d)" stroke-width="4" stroke-linejoin="round"/></symbol>
<symbol id="heart" viewBox="0 0 100 100"><path d="M50 88C10 60 4 30 26 18C40 10 50 22 50 30C50 22 62 10 76 18C96 30 90 60 50 88Z" fill="var(--c,#f48fb8)" stroke="var(--s,#222)" stroke-width="var(--w,0)" stroke-linejoin="round"/></symbol>
<symbol id="smile" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffe55c" stroke="#222" stroke-width="4"/><circle cx="36" cy="42" r="4.5" fill="#222"/><circle cx="64" cy="42" r="4.5" fill="#222"/><path d="M30 60Q50 80 70 60" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="squig" viewBox="0 0 100 40"><path d="M5 30q10-32 20 0t20 0t20 0t20 0" fill="none" stroke="var(--c,#c4a8ee)" stroke-width="7" stroke-linecap="round"/></symbol>
<symbol id="cat" viewBox="0 0 130 125"><path d="M92 106Q130 108 118 66" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/><path d="M30 82Q60 72 90 82Q102 120 60 120Q18 120 30 82Z" fill="var(--c,#fff)" stroke="#222" stroke-width="4"/><path d="M29 42L27 10L54 30M91 42L93 10L66 30" fill="var(--c,#fff)" stroke="#222" stroke-width="4" stroke-linejoin="round"/><ellipse cx="60" cy="54" rx="34" ry="28" fill="var(--c,#fff)" stroke="#222" stroke-width="4"/><circle cx="47" cy="52" r="3.5" fill="var(--e,#222)"/><circle cx="73" cy="52" r="3.5" fill="var(--e,#222)"/><path d="M56 62L64 62L60 67Z" fill="#f4a6c8"/><path d="M60 67Q56 72 52 69M60 67Q64 72 68 69" fill="none" stroke="var(--e,#222)" stroke-width="2.5"/><path d="M30 60L12 56M30 66L12 70M90 60L108 56M90 66L108 70" stroke="var(--e,#222)" stroke-width="2" opacity=".7"/><ellipse cx="40" cy="62" rx="6" ry="3.5" fill="#f9a9c3" opacity=".7"/><ellipse cx="80" cy="62" rx="6" ry="3.5" fill="#f9a9c3" opacity=".7"/></symbol>
</defs>
</svg>

<main class="sheet" id="sheet">

<!-- decoraciones de las esquinas -->
<svg class="abs tw wob" style="--c:#f4a6c8;left:3%;top:2%;width:62px;height:62px"><use href="#star4" width="62" height="62"/></svg>
<svg class="abs tw wob" style="--c:#6aa9ee;--s:#6aa9ee;right:3%;top:2%;width:64px;height:64px;animation-delay:.6s"><use href="#star4" width="64" height="64"/></svg>
<svg class="abs tw wob" style="left:14%;top:1%;width:30px;height:30px"><use href="#star" width="30" height="30"/></svg>
<svg class="abs wob" style="--c:#c4a8ee;left:8%;top:7%;width:90px;height:36px"><use href="#squig" width="90" height="36"/></svg>
<svg class="abs wob" style="--c:#ffa94d;right:10%;top:7%;width:60px;height:26px;transform:rotate(25deg)"><use href="#squig" width="60" height="26"/></svg>

<!-- TÍTULO -->
<div class="title" data-pop>
  <svg viewBox="0 0 400 60" preserveAspectRatio="none" class="wob"><path d="M5 22Q60 2 200 9T396 8Q401 30 392 46Q250 58 100 51T6 45Q-2 32 5 22Z" fill="var(--lime)"/></svg>
  <h1 class="hand" id="title"></h1>
</div>
<svg class="wavy wob" viewBox="0 0 520 14" data-pop><path d="M4 8Q130 0 260 7T516 6" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/></svg>

<div class="pills" id="pills"></div>

<!-- RAZONES + RETRATO -->
<section class="top">
  <ol class="reasons" id="reasons"></ol>

  <div class="portrait-wrap">
    <label class="portrait wob" data-pop id="portrait" title="Toca para subir su foto">
      <svg id="avatar" viewBox="0 0 120 160"><rect width="120" height="160" fill="#bfe3f7"/><path d="M18 160Q20 112 60 112Q100 112 102 160Z" fill="#f48fb8"/><ellipse cx="60" cy="78" rx="30" ry="36" fill="#ffd9b8" stroke="#222" stroke-width="3"/><path d="M28 70Q24 34 60 32Q98 34 92 70Q86 50 60 50Q38 50 28 70Z" fill="#222"/><g fill="none" stroke="#222" stroke-width="3"><circle cx="46" cy="78" r="10"/><circle cx="74" cy="78" r="10"/><path d="M56 78H64"/></g><circle cx="46" cy="78" r="2.5" fill="#222"/><circle cx="74" cy="78" r="2.5" fill="#222"/><path d="M50 98Q60 108 70 98" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/></svg>
      <img id="photo" alt="Pablo" hidden>
      <input type="file" id="file" accept="image/*">
    </label>
    <svg class="abs tw wob" style="--c:#ffd84d;left:2%;top:10%;width:38px;height:38px"><use href="#star4" width="38" height="38"/></svg>
    <svg class="abs tw wob" style="--c:#ffd84d;right:4%;top:42%;width:34px;height:34px;animation-delay:.8s"><use href="#star4" width="34" height="34"/></svg>
    <span class="tag hand" style="right:2%;top:2%;transform:rotate(14deg)">cool</span>
    <span class="tag hand" style="right:0;top:55%;transform:rotate(-12deg)">cute</span>
    <div class="him hand">¡él!</div>
    <div class="hint">(toca el óvalo para poner su foto)</div>
  </div>
</section>

<!-- decoraciones intermedias: ramo + happy -->
<div class="row" style="margin-top:10px">
  <svg viewBox="0 0 90 120" data-pop class="wob tap fl"><path d="M45 118L20 60L70 60Z" fill="#555" stroke="#222" stroke-width="3"/><g stroke="#3b8a4a" stroke-width="3"><path d="M30 60L26 38M45 60V30M60 60L66 38"/></g><circle cx="26" cy="32" r="13" fill="#f48fb8" stroke="#222" stroke-width="3"/><circle cx="45" cy="22" r="13" fill="#ffd84d" stroke="#222" stroke-width="3"/><circle cx="66" cy="32" r="13" fill="#ff9d5c" stroke="#222" stroke-width="3"/><circle cx="26" cy="32" r="4" fill="#fff"/><circle cx="45" cy="22" r="4" fill="#fff"/><circle cx="66" cy="32" r="4" fill="#fff"/></svg>
  <span class="pill b hand" style="font-size:26px">HAPPY</span>
  <svg viewBox="0 0 100 100" data-pop class="wob tap tw" style="height:70px"><use href="#smile" width="100" height="100"/></svg>
  <span class="pill b hand" style="font-size:26px;transform:rotate(3deg)">HAPPY ya</span>
  <svg viewBox="0 0 80 110" data-pop class="wob" style="height:110px"><path d="M26 72L12 108L40 94L68 108L54 72" fill="#c4a8ee" stroke="#222" stroke-width="3"/><circle cx="40" cy="42" r="32" fill="#f3c6ff" stroke="#222" stroke-width="4"/><circle cx="40" cy="42" r="22" fill="#9b7be0" stroke="#222" stroke-width="3"/><text x="40" y="53" text-anchor="middle" font-size="32" font-weight="700" fill="#fff" font-family="Gaegu">1</text></svg>
</div>

<!-- BANDA ROSA -->
<div class="band" data-pop>
  <svg viewBox="0 0 700 60" preserveAspectRatio="none" class="wob"><path d="M4 12Q180 2 350 9T696 6Q700 30 694 52Q500 58 340 52T6 54Q-2 32 4 12Z" fill="var(--pink)"/></svg>
  <p id="band"></p>
</div>

<!-- CORAZÓN GRANDE -->
<section class="heartbox" data-pop>
  <svg class="big" viewBox="0 0 400 360"><path class="tap" id="bigheart" filter="url(#crayon)" d="M200 335C60 240 20 150 55 85C90 30 170 40 200 110C230 40 310 30 345 85C380 150 340 240 200 335Z" fill="#fde5f0" stroke="#f08ab4" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <div class="txt hand" id="heartText"></div>
  <svg class="kitty wob tap fl" viewBox="0 0 130 125" style="--c:#f4f4f4"><use href="#cat" width="130" height="125"/></svg>
</section>
<p class="comfort hand" id="comfort"></p>

<!-- FILA DE STICKERS -->
<div class="row">
  <svg viewBox="0 0 110 130" data-pop class="wob tap" style="height:120px"><circle cx="55" cy="70" r="40" fill="#8a5a36" stroke="#222" stroke-width="3"/><circle cx="25" cy="34" r="14" fill="#8a5a36" stroke="#222" stroke-width="3"/><circle cx="85" cy="34" r="14" fill="#8a5a36" stroke="#222" stroke-width="3"/><ellipse cx="55" cy="82" rx="18" ry="14" fill="#e9c79a"/><circle cx="43" cy="62" r="4" fill="#222"/><circle cx="67" cy="62" r="4" fill="#222"/><ellipse cx="55" cy="76" rx="6" ry="4" fill="#222"/><path d="M55 80Q50 90 44 86M55 80Q60 90 66 86" fill="none" stroke="#222" stroke-width="2.5"/></svg>
  <!-- gatito negro y gris con colitas entrelazadas -->
  <svg viewBox="0 0 270 130" data-pop class="wob tap" style="height:150px"><g style="--c:#2b2b2f;--e:#e8e8e8"><use href="#cat" x="0" y="2" width="130" height="125"/></g><g style="--c:#d9d9de"><use href="#cat" x="140" y="2" width="130" height="125" transform="translate(410 0) scale(-1 1)"/></g><path d="M120 108Q135 125 150 108" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/></svg>
  <!-- mapache -->
  <svg viewBox="0 0 130 130" data-pop class="wob tap" style="height:125px"><path d="M100 98Q135 90 124 62" fill="none" stroke="#777" stroke-width="12" stroke-linecap="round"/><ellipse cx="62" cy="96" rx="34" ry="28" fill="#8e8e94" stroke="#222" stroke-width="3"/><path d="M26 40L28 14L50 30M98 40L96 14L74 30" fill="#8e8e94" stroke="#222" stroke-width="3"/><ellipse cx="62" cy="58" rx="36" ry="30" fill="#8e8e94" stroke="#222" stroke-width="3"/><path d="M30 52Q46 42 58 54Q46 70 30 62ZM94 52Q78 42 66 54Q78 70 94 62Z" fill="#3b3b40"/><ellipse cx="62" cy="68" rx="14" ry="10" fill="#f3f3f3"/><circle cx="44" cy="56" r="3" fill="#fff"/><circle cx="80" cy="56" r="3" fill="#fff"/><ellipse cx="62" cy="64" rx="5" ry="3.5" fill="#222"/></svg>
  <!-- dos gatitos con vestido + monito de palitos -->
  <svg viewBox="0 0 90 130" data-pop class="wob" style="height:130px"><circle cx="45" cy="22" r="14" fill="#fff" stroke="#222" stroke-width="3.5"/><path d="M45 36V84M45 48L20 70M45 48L70 66M45 84L26 122M45 84L66 120" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/></svg>
</div>
<div class="row" style="margin-top:14px">
  <svg class="tap fl" viewBox="0 0 100 100" style="--c:#f48fb8;height:44px;width:44px"><use href="#heart" width="100" height="100"/></svg>
  <svg class="tap fl" viewBox="0 0 100 100" style="--c:#f9b7d1;height:32px;width:32px;animation-delay:.5s"><use href="#heart" width="100" height="100"/></svg>
  <svg class="tap fl" viewBox="0 0 100 100" style="--c:#ee6a9e;height:52px;width:52px;animation-delay:1s"><use href="#heart" width="100" height="100"/></svg>
  <svg class="tap fl" viewBox="0 0 100 100" style="--c:#f9b7d1;height:32px;width:32px;animation-delay:1.4s"><use href="#heart" width="100" height="100"/></svg>
  <svg class="tap fl" viewBox="0 0 100 100" style="--c:#f48fb8;height:44px;width:44px;animation-delay:.2s"><use href="#heart" width="100" height="100"/></svg>
</div>

<!-- CONTADOR -->
<section class="count hand">
  <div style="font-size:30px;font-weight:700" id="countTitle"></div>
  <div id="counter"></div>
  <div id="monthsLine" style="font-size:22px;opacity:.75;margin-top:6px"></div>
</section>

<button class="btn" id="open">ábreme ♥</button>
<div class="sign hand" id="sign"></div>
</main>

<!-- CARTA FINAL -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="letter hand">
    <button class="x" id="close" aria-label="Cerrar">×</button>
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
  </div>
</div>

<script>
/* ============================================================
   ✏️  PARTES EDITABLES: cambia aquí los textos y fechas
   ============================================================ */
const CONFIG = {
  him: "Pablo",
  me: "Michelle",
  // Fecha en que empezaron (año, mes 1-12, día). Mesario: día 8 de cada mes.
  start: { y: 2024, m: 3, d: 8 },
  monthsLabel: "2 años 8 meses",   // lo que cumplen hoy
  monthNumber: 32,                  // 2 años 8 meses = 32 meses
  mesarioDia: 8,
  // Razones por las que lo amo (cámbialas por las tuyas)
  reasons: [
    "Estás ahí incluso cuando no digo nada. Con solo mirarme sabes si el día estuvo pesado, y eso no se encuentra en cualquier lado.",
    "Haces tiempo para mí aunque tengas mil cosas encima, y me haces sentir elegida cada día, no solo cuando es fácil.",
    "Me haces reír con tus cosas más random y podría hablar contigo horas sin que se me acabe el tema.",
    "Te veo esforzarte y creer en lo que haces, y estoy muy orgullosa de ti. Soy tu fan número 1, siempre.",
    "Porque eres tú, con tus manías y tu forma de ser, y me gusta todo de ti. Todo."
  ],
  comfort: "eres mi persona de confort, me haces la persona más feliz, tengo mucha suerte de tenerte",
  heartText: "todo es mejor contigo… <b>todo ha sido mejor</b> desde que llegaste tú",
  letterTitle: "Para ti, mi Pablo ♥",
  letter: [
    "Hoy cumplimos un mes más, y cada vez que llega el día 8 me quedo pensando en lo bonito que es haber llegado hasta aquí contigo.",
    "Gracias por quedarte en los días fáciles y también en los difíciles. Gracias por escucharme, por hacerme reír cuando necesito reír y por abrazarme cuando necesito callarme.",
    "Contigo aprendí que el amor puede ser tranquilo y divertido a la vez: hogar, risas, mensajes tontos y planes pequeños que se sienten enormes.",
    "No sé qué nos traiga el futuro, pero sé que quiero vivirlo a tu lado, mes tras mes. Estoy muy orgullosa de ti, de lo que eres y de lo que vas a lograr.",
    "Gracias por ser mi lugar seguro. Te amo muchísimo, hoy y todos los días."
  ]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const H = CONFIG.him;

// Textos principales
$("title").textContent = "cosas que amo de ti, " + H + " <3";
$("band").textContent = "¡FELIZ MES, " + H.toUpperCase() + "!! TE AMO";
$("comfort").textContent = CONFIG.comfort;
$("heartText").innerHTML = CONFIG.heartText;
$("sign").textContent = "con amor, " + CONFIG.me + " ♥";
$("countTitle").textContent = "llevamos juntos…";
$("monthsLine").textContent = "¡" + CONFIG.monthsLabel + " de ti y de mí!";
$("letterTitle").textContent = CONFIG.letterTitle;
$("letterBody").innerHTML = CONFIG.letter.map(p => "<p>" + p + "</p>").join("");
$("pills").innerHTML =
  '<span class="pill p hand" data-pop>mes #' + CONFIG.monthNumber + '</span>' +
  '<span class="pill l hand" data-pop>' + CONFIG.monthsLabel + '</span>' +
  '<span class="pill b hand" data-pop>cada ' + CONFIG.mesarioDia + ' ♥</span>';

// Razones numeradas
const colors = ["var(--lime)", "var(--butter)", "var(--lime)", "var(--butter)", "var(--lime)"];
$("reasons").innerHTML = CONFIG.reasons.map((t, i) =>
  '<li class="reason" data-pop><span class="num wob hand" style="background:' + colors[i % 5] + '">#' + (i + 1) + '</span><span>' + t + '</span></li>').join("");

// Efecto pop escalonado
document.querySelectorAll("[data-pop]").forEach((el, i) => el.style.animationDelay = (i * 0.07) + "s");

// Wiggle al tocar una razón
document.querySelectorAll(".reason").forEach(el => el.addEventListener("click", () => {
  el.classList.remove("wiggle"); void el.offsetWidth; el.classList.add("wiggle");
}));

// Corazoncitos al tocar gatitos / corazones
function burst(e) {
  const r = e.currentTarget.getBoundingClientRect();
  for (let i = 0; i < 7; i++) {
    const s = document.createElement("span");
    s.className = "burst";
    s.textContent = ["♥", "♡", "❤"][i % 3];
    s.style.left = (r.left + r.width / 2 + (Math.random() * 40 - 20)) + "px";
    s.style.top = (r.top + r.height / 2) + "px";
    s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    s.style.animationDelay = (i * 0.06) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1800);
  }
}
document.querySelectorAll(".tap").forEach(el => el.addEventListener("click", burst));

// Foto de Pablo (se guarda en este navegador si cabe)
function showPhoto(src) { const p = $("photo"); p.src = src; p.hidden = false; $("avatar").style.display = "none"; }
try { const s = localStorage.getItem("pabloPhoto"); if (s) showPhoto(s); } catch (e) {}
$("file").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { showPhoto(rd.result); try { localStorage.setItem("pabloPhoto", rd.result); } catch (e) {} };
  rd.readAsDataURL(f);
});

// Contador en vivo
const start = new Date(CONFIG.start.y, CONFIG.start.m - 1, CONFIG.start.d);
function tick() {
  let ms = Math.max(0, Date.now() - start.getTime());
  const d = Math.floor(ms / 864e5); ms %= 864e5;
  const h = Math.floor(ms / 36e5); ms %= 36e5;
  const m = Math.floor(ms / 6e4), s = Math.floor((ms % 6e4) / 1000);
  const box = (n, l) => '<div class="n"><b>' + n + '</b><span>' + l + '</span></div>';
  $("counter").innerHTML = box(d.toLocaleString("es"), "días") + box(h, "horas") + box(m, "min") + box(s, "seg");
}
tick(); setInterval(tick, 1000);

// Carta final
$("open").onclick = () => $("modal").classList.add("on");
$("close").onclick = () => $("modal").classList.remove("on");
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("on"); };
</script>
</body>
</html>
